name = "jo-llm"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
# No per-version preview URLs: one public address only.
preview_urls = false

# jo.md ships inside the Worker as a string. No runtime file reads.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[vars]
# Exact origins, or `*` wildcards (letters/digits/hyphens only, never a dot). The
# last entry lets the portfolio's Vercel previews (branch and per-deploy URLs)
# call Jo; that suffix is this Vercel account's own scope.
ALLOWED_ORIGINS = "https://navajyoth.com,https://www.navajyoth.com,https://portfolio-*-navajyoth-puthalath13s-projects.vercel.app"
# Links Jo may mention. Host + optional path prefix, or mailto:<address>.
# TODO: add your LinkedIn, X and public email, e.g. linkedin.com/in/<you>,x.com/<you>,mailto:<you>@<domain>
LINK_ALLOWLIST = "navajyoth.com,www.navajyoth.com,github.com/navajyoth-puthalath13"
# Which model to try first. Groq starts in ~0.5s; Gemini's free tier takes 2–8s. Flip to "gemini,groq" if that changes.
PROVIDER_ORDER = "groq,gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GROQ_MODEL = "openai/gpt-oss-120b"
# Per-person (per IP) question limits. TESTING VALUES: raised from the production defaults
# (8 per 10 minutes, 30 per day) while the portfolio integration is being tested.
# Before launch, delete these two lines (or set them back to "8" and "30") and redeploy.
PER_IP_WINDOW = "30"
PER_IP_DAILY = "100"
# Global model calls per day (UTC). Keep at or below 1000: also bounds KV cache writes on the free plan.
DAILY_BUDGET = "1000"
# Emergency override. "true" turns Jo off regardless of KV (needs a deploy or a dashboard edit).
JO_FORCE_OFF = "false"

# Kill switch (jo:enabled) and answer cache. Create with: npx wrangler kv namespace create JO_KV
[[kv_namespaces]]
binding = "JO_KV"
id = "20e0979abe9146cf97277dfb03a858c4"

# Per-IP and global daily counters (SQLite-backed Durable Objects are on the free plan).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Burst filter in front of the Durable Object: 4 questions per 10 seconds per IP hash.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 4, period = 10 }

[observability]
enabled = true
