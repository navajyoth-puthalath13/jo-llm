name = "jo-llm"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
# No per-version preview URLs: one public address only.
preview_urls = false

# The knowledge files (content/knowledge/*.md) ship inside the Worker as strings. No runtime file reads.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[vars]
# Exact origins, or `*` wildcards (letters/digits/hyphens only, never a dot). The
# last entry lets the portfolio's Vercel previews (branch and per-deploy URLs)
# call Jo; that suffix is this Vercel account's own scope.
ALLOWED_ORIGINS = "https://navajyoth.com,https://www.navajyoth.com,https://portfolio-*-navajyoth-puthalath13s-projects.vercel.app"
# Extra links Jo may mention, beyond the ones written in content/knowledge/ (those are allowed
# automatically). Host + optional path prefix, or mailto:<address>.
# Also covers every external button in content/actions.ts (test/actions.test.ts checks).
LINK_ALLOWLIST = "navajyoth.com,www.navajyoth.com,github.com/navajyoth-puthalath13,x.com/putalath,www.linkedin.com/in/navajyothp,mailto:navajyothputalath13@gmail.com,drive.google.com/file/d/19pVWr0N1-GL_lnKO11iLGKijxkJuT8qR,system-three-rouge.vercel.app,navajyothputalath13.substack.com"
# Answer models, in order, as provider:model. Each has its own free quota. Groq gpt-oss-120b has a
# 200,000-token daily cap (about 65 questions); then Gemini 3.6 Flash (low thinking, ~2.5s to the
# first word, grounded). Flash-Lite and gpt-oss-20b are NOT used for answers: they invented facts in
# testing. A model that returns 429 is skipped for its Retry-After (max 30s).
MODELS = "groq:openai/gpt-oss-120b,gemini:gemini-3.6-flash"
# Router and button picker: small structured calls with strict JSON output.
UTILITY_MODELS = "groq:openai/gpt-oss-20b,gemini:gemini-3.5-flash-lite"
# gpt-oss reasoning effort for answers: low | medium | high.
ANSWER_REASONING = "medium"
# ─── TEST MODE: ON ───────────────────────────────────────────────────────────────────────────
# Limits raised to the maximum while Navajyoth tests. To switch test mode OFF, restore these
# production values and the BURST limit below, then deploy:
#   PER_IP_BURST = "15", PER_IP_REFILL_SECONDS = "6", PER_IP_DAILY = "150", DAILY_BUDGET = "2000",
#   [[ratelimits]] simple = { limit = 10, period = 10 }
# Test mode can't raise the AI providers' own free quotas (Groq ~65 answers/day on gpt-oss-120b,
# Gemini 3.6 Flash 20/day); when those run out, Jo still says he's overloaded.
PER_IP_BURST = "100000"
PER_IP_REFILL_SECONDS = "1"
PER_IP_DAILY = "100000"
DAILY_BUDGET = "100000"
# Emergency override. "true" turns Jo off regardless of KV (needs a deploy or a dashboard edit).
JO_FORCE_OFF = "false"

# Kill switch (jo:enabled) and answer cache. Create with: npx wrangler kv namespace create JO_KV
[[kv_namespaces]]
binding = "JO_KV"
id = "20e0979abe9146cf97277dfb03a858c4"

# Per-IP and global daily counters (SQLite-backed Durable Objects are on the free plan).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Flood filter in front of the Durable Object. TEST MODE: raised to 1000 per 10 seconds.
# Production value: { limit = 10, period = 10 }.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 1000, period = 10 }

[observability]
enabled = true
